# Pages CMS configuration (https://pagescms.org)
# Defines the editing forms. Editors never need to touch this file.

media:
  - name: images
    label: Images
    input: assets/images
    output: /images
    categories: [image]
  - name: files
    label: Files (PDF)
    input: static/files
    output: /files
    categories: [document]
  - name: fonts
    label: Fonts
    input: static/fonts
    output: /fonts
    extensions: [woff2, woff, ttf, otf]

components:
  hero:
    type: object
    label: Header image
    description: Large photo at the top of the page. Leave empty for a simple text heading.
    fields:
      - name: image
        label: Image
        type: image
        options:
          media: images
      - name: position
        label: Focus point
        description: Which part of the photo stays visible when it is cropped.
        type: select
        default: center
        options:
          values:
            - { value: center, label: Center }
            - { value: center top, label: Top }
            - { value: center bottom, label: Bottom }
            - { value: left center, label: Left }
            - { value: right center, label: Right }
      - name: overlay
        label: Darken (%)
        description: Makes text on bright photos easier to read. 0 = not at all, 80 = strongly.
        type: number
        default: 35
        options:
          min: 0
          max: 80
      - name: text_color
        label: Text colour on the image
        type: select
        default: light
        options:
          values:
            - { value: light, label: Light (for dark photos) }
            - { value: dark, label: Dark (for bright photos) }
      - name: height
        label: Height
        type: select
        default: medium
        options:
          values:
            - { value: full, label: Full screen }
            - { value: large, label: Large }
            - { value: medium, label: Medium }
            - { value: small, label: Small }
      - name: headline
        label: Headline (optional)
        description: Leave empty to use the page title (or the site name on the home page).
        type: string
      - name: subline
        label: Subline (optional)
        type: string

  quotes:
    type: object
    label: Quotes
    list: true
    fields:
      - name: text
        label: Quote
        type: text
      - name: source
        label: Source
        type: string
  buttons:
    type: object
    label: Buttons
    description: "e.g. “Concerts” → /live/ or an external link starting with https://"
    list: true
    fields:
      - name: label
        label: Label
        type: string
      - name: url
        label: Link
        type: string
  gallery_style:
    type: select
    label: Photo layout
    default: grid
    options:
      values:
        - { value: grid, label: Grid (cropped to squares) }
        - { value: masonry, label: Masonry (original proportions) }
        - { value: stacked, label: "Stacked: large, one below the other, with captions" }
  gallery_images:
    type: object
    label: Photos
    description: Drag to reorder. Only use photos you have permission to use.
    list: true
    fields:
      - name: image
        label: Photo
        type: image
        required: true
        options:
          media: images
      - name: alt
        label: Image description (for blind visitors)
        description: "What can be seen? e.g. “On stage with cello, warm light”"
        type: string
        required: true
      - name: caption
        label: Caption (optional)
        type: string
      - name: credit
        label: Photographer
        type: string
        required: true

content:
  # ------------------------------------------------------------------ Concerts
  - name: concerts
    label: Concerts
    type: collection
    path: content/live
    exclude: [_index.md]
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [date, city, title, status]
      primary: city
      sort: [date, city]
      default:
        sort: date
        order: desc
    fields:
      - name: date
        label: Date
        type: date
        required: true
      - name: time
        label: Time
        description: 24-hour format, e.g. 19:30
        type: string
      - name: city
        label: City
        type: string
        required: true
      - name: venue
        label: Venue
        type: string
      - name: title
        label: Programme / title
        description: "e.g. “Bach & Beyond” or “Duo with piano”"
        type: string
      - name: ticket_url
        label: Ticket link
        description: Full address, starting with https://
        type: string
      - name: status
        label: Status
        type: select
        default: normal
        options:
          values:
            - { value: normal, label: Normal }
            - { value: soldout, label: Sold out }
            - { value: cancelled, label: Cancelled }
            - { value: free, label: Free entry }
      - name: note
        label: Note (optional)
        description: "Short extra info, e.g. “with guests”"
        type: string

  # ------------------------------------------------------------------ Projects
  - name: projects
    label: Projects
    type: collection
    path: content/projects
    exclude: [_index.md]
    filename: "{primary}.md"
    view:
      fields: [title, subtitle, weight]
      primary: title
      sort: [weight, title]
      default:
        sort: weight
        order: asc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: subtitle
        label: Subtitle
        description: "e.g. “Album”, “Duo with piano”, “Solo programme”"
        type: string
      - name: year
        label: Year (optional)
        type: string
      - name: weight
        label: Order
        description: Lower number = further up (in the overview and in the menu).
        type: number
        default: 10
      - name: hero
        component: hero
      - name: cover
        label: Cover / image next to the text (optional)
        description: Square image, e.g. an album cover. Shown to the left of the text and in the project overview.
        type: image
        options:
          media: images
      - name: body
        label: Text
        type: rich-text
      - name: quotes
        component: quotes
      - name: buttons
        component: buttons
      - name: bandcamp
        label: Bandcamp player (optional)
        description: "On Bandcamp: album → Share/Embed → copy the code and paste it here in full (or just the album number)."
        type: text
      - name: video
        label: YouTube video (optional)
        description: Link to the video, e.g. https://www.youtube.com/watch?v=… – only loads after a visitor clicks.
        type: string
      - name: bandcamp_url
        label: Link to Bandcamp (optional)
        type: string
      - name: faircamp_url
        label: Faircamp link (optional, for later)
        type: string
      - name: links
        label: More links (streaming, shop)
        type: object
        list: true
        fields:
          - name: platform
            label: Platform
            type: select
            options:
              values:
                - { value: spotify, label: Spotify }
                - { value: applemusic, label: Apple Music }
                - { value: youtube, label: YouTube }
                - { value: soundcloud, label: SoundCloud }
                - { value: bandcamp, label: Bandcamp }
                - { value: website, label: Other website / shop }
          - name: label
            label: Label (optional)
            type: string
          - name: url
            label: Address
            type: string
      - name: tracklist
        label: Tracklist (optional)
        type: string
        list: true
      - name: credits
        label: Credits (optional)
        description: "One line per person, e.g. “Piano: Name”"
        type: text
      - name: gallery_title
        label: Heading above the photos (optional)
        type: string
      - name: gallery_style
        component: gallery_style
      - name: images
        component: gallery_images

  # ------------------------------------------------------------------ Pages
  - name: home
    label: Home page
    type: file
    path: content/_index.md
    fields:
      - name: title
        label: Page title
        type: string
        hidden: true
      - name: hero
        component: hero
      - name: quotes
        component: quotes
      - name: buttons
        component: buttons
      - name: concerts_count
        label: Number of upcoming concerts on the home page
        description: 0 = don't show any
        type: number
        default: 3
      - name: show_newsletter
        label: Show newsletter sign-up on the home page
        type: boolean
      - name: body
        label: Additional text (optional)
        type: rich-text

  - name: about
    label: About
    type: file
    path: content/about.md
    fields:
      - name: title
        label: Title
        type: string
      - name: description
        label: Short description (for Google & link previews)
        type: string
      - name: hero
        component: hero
      - name: image
        label: Portrait photo
        type: image
        options:
          media: images
      - name: image_alt
        label: Image description (for blind visitors)
        type: string
      - name: image_credit
        label: Photographer
        type: string
      - name: body
        label: Text
        type: rich-text
      - name: downloads
        label: Downloads
        type: object
        list: true
        fields:
          - name: label
            label: Label
            type: string
          - name: file
            label: File
            type: file
            options:
              media: files

  - name: live_page
    label: Concerts – page header
    type: file
    path: content/live/_index.md
    fields:
      - name: title
        label: Title
        type: string
      - name: hero
        component: hero
      - name: body
        label: Intro text (optional)
        type: rich-text

  - name: projects_page
    label: Projects – overview page
    type: file
    path: content/projects/_index.md
    fields:
      - name: title
        label: Title
        type: string
      - name: hero
        component: hero
      - name: body
        label: Intro text (optional)
        type: rich-text

  - name: gallery
    label: Gallery
    type: file
    path: content/gallery.md
    fields:
      - name: title
        label: Title
        type: string
      - name: layout
        type: string
        hidden: true
        default: gallery
      - name: hero
        component: hero
      - name: style
        component: gallery_style
      - name: images
        component: gallery_images
      - name: body
        label: Intro text (optional)
        type: rich-text

  - name: contact
    label: Contact
    type: file
    path: content/contact.md
    fields:
      - name: title
        label: Title
        type: string
      - name: layout
        type: string
        hidden: true
        default: contact
      - name: hero
        component: hero
      - name: body
        label: Intro text
        type: rich-text
      - name: contacts
        label: Contacts
        type: object
        list: true
        fields:
          - name: label
            label: Area
            description: e.g. General, Booking, Press
            type: string
          - name: name
            label: Name
            type: string
          - name: info
            label: Extra info (optional)
            type: string
          - name: email
            label: Email
            type: string
          - name: phone
            label: Phone (optional)
            type: string
          - name: subject
            label: Pre-filled email subject (optional)
            type: string

  - name: impressum
    label: Legal notice (Impressum)
    type: file
    path: content/impressum.md
    fields:
      - name: title
        label: Title
        description: Keep “Impressum” – that is the term German law expects.
        type: string
      - name: layout
        type: string
        hidden: true
        default: impressum
      - name: name
        label: First and last name
        type: string
        required: true
      - name: business
        label: Business / artist name (optional)
        type: string
      - name: address
        label: Postal address
        description: Street, postcode and city, country – no P.O. box. Required by German law.
        type: text
        required: true
      - name: email
        label: Email
        type: string
        required: true
      - name: phone
        label: Phone (optional)
        type: string
      - name: vat_id
        label: VAT ID (if you have one)
        type: string
      - name: responsible_name
        label: Person responsible for the content (name)
        type: string
      - name: responsible_address
        label: Address of the responsible person (empty = same as above)
        type: text
      - name: body
        label: Further information (optional)
        type: rich-text

  - name: privacy
    label: Privacy policy
    type: file
    path: content/privacy.md
    fields:
      - name: title
        label: Title
        type: string
      - name: body
        label: Text
        description: Paste the text from a privacy policy generator here.
        type: rich-text

  # ------------------------------------------------------------------ Settings
  - name: settings
    label: Site settings
    type: file
    path: data/settings.yml
    format: yaml
    fields:
      - name: site_name
        label: Name (shown at the top of every page)
        type: string
        required: true
      - name: tagline
        label: Tagline
        description: "e.g. “Cello” or “Cellist & composer”"
        type: string
      - name: description
        label: Short description for Google
        type: text
      - name: logo
        label: Logo (optional, replaces the name in the header)
        type: image
        options:
          media: images
      - name: favicon
        label: Favicon (small square icon in the browser tab)
        type: image
        options:
          media: images
      - name: email
        label: Main email (footer)
        type: string
      - name: nav
        label: Menu
        type: object
        list: true
        fields:
          - name: label
            label: Label
            type: string
          - name: url
            label: Link
            type: string
          - name: dropdown
            label: Show sub-pages as a drop-down menu
            description: "e.g. for “Projects” – all projects appear in the menu automatically."
            type: boolean
      - name: colors
        label: Colours
        description: "As a colour code, e.g. #ffffff for white."
        type: object
        fields:
          - name: background
            label: Background
            type: string
          - name: surface
            label: Boxes (contact cards, newsletter)
            type: string
          - name: text
            label: Text
            type: string
          - name: accent
            label: Accent (links, buttons)
            type: string
      - name: fonts
        label: Fonts
        type: object
        fields:
          - name: heading
            label: Headings
            type: object
            fields: &fontfields
              - name: preset
                label: Font
                type: select
                options:
                  values:
                    - { value: cormorant, label: Cormorant Garamond (elegant serif) }
                    - { value: worksans, label: Work Sans (clean sans-serif) }
                    - { value: serif, label: System serif font }
                    - { value: sans, label: System sans-serif font }
                    - { value: custom, label: Custom font (upload below) }
              - name: custom_name
                label: Name of the custom font
                type: string
              - name: regular
                label: Regular file (.woff2)
                type: file
                options:
                  media: fonts
              - name: bold
                label: Bold file (optional)
                type: file
                options:
                  media: fonts
              - name: italic
                label: Italic file (optional)
                type: file
                options:
                  media: fonts
          - name: body
            label: Body text
            type: object
            fields: *fontfields
          - name: heading_uppercase
            label: Headings in capital letters
            type: boolean
      - name: social
        label: Social media
        type: object
        list: true
        fields:
          - name: platform
            label: Platform
            type: select
            options:
              values:
                - { value: instagram, label: Instagram }
                - { value: facebook, label: Facebook }
                - { value: youtube, label: YouTube }
                - { value: spotify, label: Spotify }
                - { value: bandcamp, label: Bandcamp }
                - { value: applemusic, label: Apple Music }
                - { value: soundcloud, label: SoundCloud }
                - { value: tiktok, label: TikTok }
                - { value: mastodon, label: Mastodon }
                - { value: bluesky, label: Bluesky }
                - { value: threads, label: Threads }
                - { value: x, label: X }
                - { value: website, label: Other website }
          - name: url
            label: Address
            type: string
      - name: newsletter
        label: Newsletter
        type: object
        fields:
          - name: enabled
            label: Show newsletter sign-up
            type: boolean
          - name: title
            label: Heading
            type: string
          - name: text
            label: Text
            type: text
          - name: embed
            label: Provider's embed code
            description: Sign-up form code from Brevo, CleverReach or similar (turn on double opt-in!).
            type: code
            options:
              language: html
      - name: footer_text
        label: Extra text in the footer (optional)
        type: string
